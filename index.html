<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMP Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" href="data:,">
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl max-w-md w-full border border-slate-700 text-center">
        <h1 class="text-2xl font-bold mb-2">Minecraft SMP Panel</h1>
        <p class="text-slate-400 text-sm mb-6">Managed via Supabase & Edge Proxy</p>

        <div id="status-badge" class="mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-slate-700 text-slate-300 border border-slate-600">
            Checking Status...
        </div>

        <div class="space-y-3">
            <button onclick="controlServer('start')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                Start Server
            </button>
            <button onclick="controlServer('stop')" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                Stop Server
            </button>
            <button onclick="checkServerStatus()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-lg transition">
                Refresh Status
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cvcyqbowqzpprttieacg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2Y3lxYm93cXpwcHJ0dGllYWNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTIxMzcsImV4cCI6MjEwNzQ2ODEzN30.S3ZsiuGhoBfN1oiiN79cSEb5VQsIKrS6GJg2CxjVJis';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkServerStatus() {
            const badge = document.getElementById('status-badge');
            try {
                const { data, error } = await dbClient.functions.invoke('falix-proxy', {
                    body: { action: 'status' }
                });

                if (error) throw error;

                const state = data?.attributes?.current_state;
                if (state === 'running') {
                    badge.innerText = "Server Online 🟢";
                    badge.className = "mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                } else if (state === 'starting') {
                    badge.innerText = "Server Starting... 🟡";
                    badge.className = "mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30";
                } else {
                    badge.innerText = "Server Offline 🔴";
                    badge.className = "mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                }
            } catch (err) {
                badge.innerText = "Error Fetching Status ⚠️";
                badge.className = "mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                console.error(err);
            }
        }

        async function controlServer(signal) {
            try {
                const { error } = await dbClient.functions.invoke('falix-proxy', {
                    body: { action: 'control', signal: signal }
                });

                if (error) throw error;
                alert(`Server ${signal} command sent successfully!`);
                setTimeout(checkServerStatus, 3000);
            } catch (err) {
                alert(`Failed to send command: ${err.message}`);
            }
        }

        checkServerStatus();
    </script>
</body>
</html>

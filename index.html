<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMP Control Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl max-w-md w-full border border-slate-700 text-center">
        <h1 class="text-2xl font-bold mb-2">Minecraft SMP Panel</h1>
        <p class="text-slate-400 text-sm mb-6">Fetch credentials from Supabase & manage server</p>

        <!-- Status Badge -->
        <div id="status-badge" class="mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-slate-700 text-slate-300 border border-slate-600">
            Fetching Key from DB...
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3">
            <button onclick="controlServer('start')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                Start Server
            </button>
            <button onclick="controlServer('stop')" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                Stop Server
            </button>
            <button onclick="checkServerStatus()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 rounded-lg transition">
                Refresh Status
            </button>
        </div>
    </div>

    <script>
        // 1. Fill in your Supabase project details
        const SUPABASE_URL = 'https://cvcyqbowqzpprttieacg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2Y3lxYm93cXpwcHJ0dGllYWNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTIxMzcsImV4cCI6MjEwNzQ2ODEzN30.S3ZsiuGhoBfN1oiiN79cSEb5VQsIKrS6GJg2CxjVJis';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let falixApiKey = '';
        let falixServerId = '';

        // 2. Load API key and Server ID from Supabase
        async function loadConfigFromSupabase() {
            try {
                const { data, error } = await supabase
                    .from('server_config')
                    .select('falix_api_key, falix_server_id')
                    .limit(1)
                    .single();

                if (error || !data) {
                    throw new Error(error ? error.message : "No key found in database");
                }

                falixApiKey = data.falix_api_key;
                falixServerId = data.falix_server_id;

                const badge = document.getElementById('status-badge');
                badge.innerText = "Config Loaded from DB";
                badge.className = "mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30";

                checkServerStatus();
            } catch (err) {
                const badge = document.getElementById('status-badge');
                badge.innerText = "Error Loading Config";
                badge.className = "mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                console.error("Database fetch error:", err);
            }
        }

        // 3. Send Start/Stop request using the loaded credentials
        async function controlServer(signal) {
            if (!falixApiKey || !falixServerId) {
                alert("API Key not loaded from Supabase yet.");
                return;
            }

            try {
                const response = await fetch(`https://client.falixnodes.net/api/v2/servers/${falixServerId}/power`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${falixApiKey}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ signal: signal })
                });

                if (response.ok) {
                    alert(`Server ${signal} command sent!`);
                    setTimeout(checkServerStatus, 3000);
                } else {
                    alert(`Failed to send command. Status code: ${response.status}`);
                }
            } catch (error) {
                alert(`Error connecting to Falix API: ${error.message}`);
            }
        }

        // 4. Fetch status from Falix API
        async function checkServerStatus() {
            if (!falixApiKey || !falixServerId) return;

            try {
                const response = await fetch(`https://client.falixnodes.net/api/v2/servers/${falixServerId}`, {
                    headers: {
                        'Authorization': `Bearer ${falixApiKey}`,
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();
                const state = data?.attributes?.current_state;
                const badge = document.getElementById('status-badge');

                if (state === 'running') {
                    badge.innerText = "Server Online 🟢";
                    badge.className = "mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                } else if (state === 'starting') {
                    badge.innerText = "Server Starting... 🟡";
                    badge.className = "mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30";
                } else {
                    badge.innerText = "Server Offline 🔴";
                    badge.className = "mb-6 inline-block px-4 py-1.5 rounded-full text-sm font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                }
            } catch (err) {
                console.error("Failed to check status:", err);
            }
        }

        // Initialize on page load
        loadConfigFromSupabase();
    </script>
</body>
</html>
